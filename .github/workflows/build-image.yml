name: Build and push to Cloud.ru

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Cloud.ru Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ytcipher.cr.cloud.ru
          username: ${{ secrets.554f5ae2ae53746fe611b16c2beeb1c0 }}
          password: ${{ secrets.2f79ba65faad55cf189effbdfe2199b5 }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ytcipher.cr.cloud.ru/yt-cipher:latest
