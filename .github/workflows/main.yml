name: Build and push to Cloud.ru

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Cloud.ru
        uses: docker/login-action@v3
        with:
          registry: ytcipher.cr.cloud.ru
          username: ${{ secrets.CLOUD_KEY_ID  }}
          password: ${{ secrets.CLOUD_KEY_SECRET }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ytcipher.cr.cloud.ru/yt-cipher:latest
